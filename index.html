<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Browser tab favicon. The previous href pointed to /logo.png which does not
    exist in /public, and the type lied (svg+xml on a PNG), so most browsers
    showed the generic globe icon. Pointing every icon slot at the real
    amp-logo.png that's already in /public.
  -->
  <link rel="icon" type="image/png" href="/amp-logo.png" />
  <link rel="shortcut icon" type="image/png" href="/amp-logo.png" />
  <link rel="apple-touch-icon" href="/amp-logo.png" />

  <!--
    Latency hints for Ghana (and anywhere far from Supabase eu-west).
    preconnect opens TCP+TLS in parallel with the HTML download so the first
    Supabase fetch doesn't pay the ~200ms RTT handshake serially.
    dns-prefetch is the cheap fallback for browsers that cap preconnects.
  -->
  <link rel="preconnect" href="https://kfjncxphokthkuwypiea.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="//kfjncxphokthkuwypiea.supabase.co" />
  <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="//generativelanguage.googleapis.com" />

  <!-- Default metadata for the home page. Each public route replaces the title,
       description, canonical and Open Graph tags at runtime (src/site/seo). -->
  <title>AMP Lodge | Boutique Lodge in Abuakwa, Kumasi</title>
  <meta name="description" content="AMP Lodge is a welcoming retreat at Abuakwa DKC Junction on the Kumasi–Sunyani Road. Thoughtful rooms, genuine Ghanaian hospitality and direct online booking." />
  <link rel="canonical" href="https://amplodge.org/" />
  <meta name="theme-color" content="#121312" />
  <meta name="color-scheme" content="light" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AMP Lodge" />
  <meta property="og:locale" content="en_GH" />
  <meta property="og:title" content="AMP Lodge | Boutique Lodge in Abuakwa, Kumasi" />
  <meta property="og:description" content="Arrive. Unwind. Feel at home. A welcoming retreat in Kumasi where thoughtful comfort meets genuine hospitality." />
  <meta property="og:url" content="https://amplodge.org/" />
  <meta property="og:image" content="https://amplodge.org/images/og/amp-lodge-og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The stone façade of AMP Lodge in Abuakwa, Kumasi" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LodgingBusiness",
      "@id": "https://amplodge.org/#lodge",
      "name": "AMP Lodge",
      "url": "https://amplodge.org/",
      "image": ["https://amplodge.org/images/og/amp-lodge-og.jpg"],
      "logo": "https://amplodge.org/amp-logo.png",
      "telephone": "+233555009697",
      "email": "info@amplodge.org",
      "priceRange": "GH₵350–GH₵1,200 per night",
      "currenciesAccepted": "GHS",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Abuakwa DKC Junction, Kumasi–Sunyani Road",
        "addressLocality": "Kumasi",
        "addressRegion": "Ashanti Region",
        "addressCountry": "GH"
      },
      "hasMap": "https://www.google.com/maps/search/?api=1&query=AMP%20LODGE%2C%20Abuakwa%20DKC%20junction%2C%20Kumasi-Sunyani%20Rd%2C%20Kumasi%2C%20Ghana"
    }
  </script>
</head>

<body>
  <div id="app-root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
