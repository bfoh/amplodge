[functions.sync-channels]
  schedule = "*/30 * * * *"

# Check-out morning SMS, 07:30 Ghana time (GMT). Switched on in Settings → Door locks.
[functions.key-card-checkout-sms]
  schedule = "30 7 * * *"

[build]
  command = "npm run build && cd netlify/functions && npm install"
  publish = "dist"
  functions = "netlify/functions"
  
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  publish = "dist"
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# Caching headers tuned for Ghana (and any high-latency region).
# Vite emits hashed filenames in /assets/, so they are safe to cache forever.
# index.html MUST stay no-cache so users always pick up new builds.
# /sw.js is a kill-switch worker (PWA removed) and must also stay no-cache so
# devices with the old service worker fetch it and self-uninstall.
# -----------------------------------------------------------------------------

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Public-site photographs and the hero film/poster. Not content-hashed, so a
# week rather than forever: rename a file to change it immediately. Being
# cacheable also lets the hero <img> reuse the poster the head script started
# downloading, instead of revalidating it on the critical path.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# The arrival film's frame sequences (scripts/build-film-frames.mjs).
[[headers]]
  for = "/film/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
